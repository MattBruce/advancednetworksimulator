<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c33"/>
      <stop offset="100%" stop-color="#14151a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Network Interconnect Lines (Subtle) -->
  <line x1="32" y1="32" x2="32" y2="15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="32" y1="32" x2="47" y2="42" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="32" y1="32" x2="17" y2="42" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Core Spinner Ring (3/4 open circle matching the loader) -->
  <path d="M 32 10 A 22 22 0 1 1 10 32" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Center Hub Node -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>

  <!-- Satellite Network Nodes -->
  <circle cx="32" cy="15" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="47" cy="42" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="17" cy="42" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
</svg>
