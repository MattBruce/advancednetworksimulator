name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Static Site
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ]; then echo "::error::GitHub Secret SERVER_HOST is missing or empty."; exit 1; fi
          if [ -z "$SERVER_USER" ]; then echo "::error::GitHub Secret SERVER_USER is missing or empty."; exit 1; fi
          if [ -z "$SERVER_PORT" ]; then echo "::error::GitHub Secret SERVER_PORT is missing or empty."; exit 1; fi
          if [ -z "$SERVER_TARGET_DIR" ]; then echo "::error::GitHub Secret SERVER_TARGET_DIR is missing or empty."; exit 1; fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then echo "::error::GitHub Secret SSH_PRIVATE_KEY is missing or empty."; exit 1; fi

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy via rsync
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR }}
        run: |
          rsync -avz --delete \
            -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.vscode' \
            --exclude='README.md' \
            --exclude='LICENSE*' \
            ./ "$SERVER_USER@$SERVER_HOST:$SERVER_TARGET_DIR"
